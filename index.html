<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omega -  AI </title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030711; color: #fff; font-family: system-ui; padding: 16px; }
  .logo { font-size: 32px; font-weight: 900; background: linear-gradient(90deg, #22c55e, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
  .free-badge { background: linear-gradient(90deg, #22c55e, #00d4ff); padding: 8px; border-radius: 10px; text-align: center; font-weight: 900; margin: 10px 0 16px 0; }
  .nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .nav-btn { padding: 10px 4px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; font-size: 11px; text-align: center; cursor: pointer; }
  .nav-btn.active { background: linear-gradient(90deg, #22c55e, #00d4ff); border: none; font-weight: 800; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  input, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #030711; color: #fff; margin: 8px 0; }
  .btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #22c55e, #00d4ff); border: none; border-radius: 14px; color: #fff; font-weight: 800; margin-top: 10px; cursor: pointer; }
  .btn.danger { background: #ef4444; }
  .result { padding: 14px; border-radius: 10px; margin-top: 12px; background: rgba(34,197,94,0.1); border-left: 3px solid #22c55e; white-space: pre-line; }
  .result.lie { background: rgba(239,68,68,0.2); border: 2px solid #ef4444; color: #ef4444; text-align:center; font-weight:800; }
  .result.truth { background: rgba(34,197,94,0.2); border: 2px solid #22c55e; color: #22c55e; text-align:center; font-weight:800; }
  .fingerprint { font-size: 100px; text-align: center; margin: 20px 0; }
  .scan-box { display: none; }
</style>
</head>
<body>
  <div class="logo">OMEGA</div>
  <div class="free-badge">✨ 100% FREE - ALL 10 AI TOOLS ✨</div>

  <div class="nav" id="navbar">
    <div class="nav-btn active" data-tab="health">🏥<br>Health</div>
    <div class="nav-btn" data-tab="school">🎓<br>School</div>
    <div class="nav-btn" data-tab="farm">🌾<br>Farm</div>
    <div class="nav-btn" data-tab="trade">📈<br>Trade</div>
    <div class="nav-btn" data-tab="jobs">💼<br>Jobs</div>
    <div class="nav-btn" data-tab="legal">⚖️<br>Legal</div>
    <div class="nav-btn" data-tab="realestate">🏠<br>Estate</div>
    <div class="nav-btn" data-tab="content">✍️<br>Content</div>
    <div class="nav-btn" data-tab="finance">💰<br>Finance</div>
    <div class="nav-btn" data-tab="lie">🔍<br>Lie</div>
  </div>

  <div id="health" class="tab-content active"><div class="card"><h2>🏥 AI Doctor</h2><textarea id="symptom" rows="3" placeholder="Symptoms"></textarea><button class="btn" id="btnHealth">Ask Doctor</button><div id="healthResult"></div></div></div>
  <div id="school" class="tab-content"><div class="card"><h2>🎓 Tutor</h2><input id="subject" placeholder="Subject"><textarea id="question" rows="2" placeholder="1+1 or 5*8"></textarea><button class="btn" id="btnSchool">Get Answer</button><div id="schoolResult"></div></div></div>
  <div id="farm" class="tab-content"><div class="card"><h2>🌾 Farm</h2><input id="crop" placeholder="Crop"><button class="btn" id="btnFarm">Get Price</button><div id="farmResult"></div></div></div>
  <div id="trade" class="tab-content"><div class="card"><h2>📈 Trade</h2><button class="btn" id="btnTrade">Scan</button><div id="tradeResult"></div></div></div>
  <div id="jobs" class="tab-content"><div class="card"><h2>💼 Jobs</h2><button class="btn" id="btnJobs">Find</button><div id="jobsResult"></div></div></div>
  <div id="legal" class="tab-content"><div class="card"><h2>⚖️ Legal</h2><button class="btn" id="btnLegal">Advice</button><div id="legalResult"></div></div></div>
  <div id="realestate" class="tab-content"><div class="card"><h2>🏠 Estate</h2><button class="btn" id="btnEstate">Check</button><div id="estateResult"></div></div></div>
  <div id="content" class="tab-content"><div class="card"><h2>✍️ Content</h2><button class="btn" id="btnContent">Generate</button><div id="contentResult"></div></div></div>
  <div id="finance" class="tab-content"><div class="card"><h2>💰 Finance</h2><button class="btn" id="btnFinance">Budget</button><div id="financeResult"></div></div></div>
  <div id="lie" class="tab-content"><div class="card" id="lieStep1"><h2>🔍 Lie Detector</h2><textarea id="lieQuestion" rows="2" placeholder="Is he lying"></textarea><button class="btn danger" id="btnAskLie">Ask</button></div><div class="card scan-box" id="lieStep2"><h2>Scan</h2><p><b id="showQuestion"></b></p><div class="fingerprint">👆</div><button class="btn danger" id="btnScanLie">Scan</button></div><div id="lieResult"></div></div>

<script>
let currentQuestion = "";

// TAB SWITCHING
document.getElementById('navbar').addEventListener('click', function(e){
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  btn.classList.add('active');
});

// BUTTONS
document.getElementById('btnHealth').onclick = () => document.getElementById('healthResult').innerHTML = `<div class="result">Drink water. Rest.</div>`;
document.getElementById('btnSchool').onclick = () => {
  const q = document.getElementById('question').value;
  let ans = "Answer: ";
  try{ ans += Function('return '+q)(); }catch{ ans = "Review this topic in textbook"; }
  document.getElementById('schoolResult').innerHTML = `<div class="result">${ans}</div>`;
}
document.getElementById('btnFarm').onclick = () => document.getElementById('farmResult').innerHTML = `<div class="result">Price: ₦85K/bag</div>`;
document.getElementById('btnTrade').onclick = () => document.getElementById('tradeResult').innerHTML = `<div class="result">Profit ₦35K</div>`;
document.getElementById('btnJobs').onclick = () => document.getElementById('jobsResult').innerHTML = `<div class="result">$1200/mo Remote</div>`;
document.getElementById('btnLegal').onclick = () => document.getElementById('legalResult').innerHTML = `<div class="result">CAC: ₦15,000</div>`;
document.getElementById('btnEstate').onclick = () => document.getElementById('estateResult').innerHTML = `<div class="result">Price rising</div>`;
document.getElementById('btnContent').onclick = () => document.getElementById('contentResult').innerHTML = `<div class="result">Viral Hook</div>`;
document.getElementById('btnFinance').onclick = () => document.getElementById('financeResult').innerHTML = `<div class="result">Save 20%</div>`;

document.getElementById('btnAskLie').onclick = () => {
  currentQuestion = document.getElementById('lieQuestion').value;
  document.getElementById('showQuestion').innerText = currentQuestion;
  document.getElementById('lieStep1').style.display = 'none';
  document.getElementById('lieStep2').style.display = 'block';
}
document.getElementById('btnScanLie').onclick = () => {
  const isLie = Math.random() > 0.5;
  document.getElementById('lieResult').innerHTML = isLie 
    ? `<div class="result lie">🚨 LIE DETECTED</div>`
    : `<div class="result truth">✅ TRUTH</div>`;
  document.getElementById('lieStep2').style.display = 'none';
  setTimeout(()=>document.getElementById('lieStep1').style.display='block', 3000);
}
</script>
</body>
</html>
