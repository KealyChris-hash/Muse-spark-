<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omega - AI Car</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #030711 0%, #0a1120 100%);
    color: #fff;
    padding: 16px;
    min-height: 100vh;
  }
  .container { max-width: 600px; margin: 0 auto; }
  
  header { text-align: center; margin-bottom: 20px; }
  .logo {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(90deg, #00d4ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -2px;
  }
  .status { color: #22c55e; font-size: 12px; margin-top: 4px; }
  
  .card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  
  h2 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, #00d4ff, #7c3aed);
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn.secondary { background: #1e293b; border: 1px solid #334155; }
  .btn.danger { background: #ef4444; }
  
  /* Battery */
  .battery-wrap { text-align: center; }
  .battery {
    width: 120px; height: 200px;
    border: 4px solid #00d4ff;
    border-radius: 20px;
    margin: 15px auto;
    position: relative;
    background: #0f172a;
  }
  .battery-fill {
    position: absolute; bottom: 0;
    width: 100%; background: linear-gradient(180deg, #00d4ff, #7c3aed);
    border-radius: 0 0 16px 16px;
    transition: height 1s ease;
  }
  .battery-percent {
    font-size: 32px; font-weight: 900; margin-top: 10px;
  }
  
  /* Maps */
  input {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px;
  }
  
  /* Autopilot */
  .toggle {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; background: #0f172a; border-radius: 12px; margin: 8px 0;
  }
  .switch {
    width: 50px; height: 28px; background: #334155; border-radius: 20px;
    position: relative; cursor: pointer;
  }
  .switch.on { background: #00d4ff; }
  .switch-dot {
    width: 22px; height: 22px; background: #fff; border-radius: 50%;
    position: absolute; top: 3px; left: 3px; transition: 0.3s;
  }
  .switch.on .switch-dot { left: 25px; }
  
  .connected { color: #22c55e; font-size: 12px; }
  .disconnected { color: #ef4444; font-size: 12px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">OMEGA</div>
      <div class="status" id="btStatus">● Disconnected</div>
    </header>

    <!-- 1. BLUETOOTH CONNECTION -->
    <div class="card">
      <h2>📱 Connect to Omega</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:10px;">Connect via Bluetooth to control your car</p>
      <button class="btn" onclick="connectBluetooth()">Connect Bluetooth</button>
    </div>

    <!-- 2. CHARGING PERCENTAGE -->
    <div class="card">
      <h2>🔋 Battery & Charging</h2>
      <div class="battery-wrap">
        <div class="battery">
          <div class="battery-fill" id="batteryFill" style="height: 68%;"></div>
        </div>
        <div class="battery-percent" id="batteryPercent">68%</div>
        <p style="font-size:13px; color:#94a3b8;">Range: 240km | Charging: 45min left</p>
        <button class="btn secondary" onclick="startCharging()">Start Smart Charge</button>
      </div>
    </div>

    <!-- 3. AUTOPILOT -->
    <div class="card">
      <h2>🚗 Autopilot</h2>
      <div class="toggle">
        <span>Lane Keep Assist</span>
        <div class="switch" onclick="toggleSwitch(this)"><div class="switch-dot"></div></div>
      </div>
      <div class="toggle">
        <span>Adaptive Cruise</span>
        <div class="switch" onclick="toggleSwitch(this)"><div class="switch-dot"></div></div>
      </div>
      <div class="toggle">
        <span>Auto Parking</span>
        <div class="switch" onclick="toggleSwitch(this)"><div class="switch-dot"></div></div>
      </div>
      <button class="btn danger" onclick="alert('Autopilot Engaged')">Engage Autopilot</button>
    </div>

    <!-- 4. GOOGLE MAPS NAVIGATION -->
    <div class="card">
      <h2>🗺️ Navigate with Google Maps</h2>
      <input type="text" id="destination" placeholder="Enter destination... e.g. Ikeja City Mall">
      <button class="btn" onclick="navigate()">Send to Omega & Drive</button>
      <p style="font-size:12px; color:#94a3b8; margin-top:8px;">Tap will open Google Maps with directions</p>
    </div>

  </div>

<script>
let batteryLevel = 68;
let charging = false;

function connectBluetooth() {
  document.getElementById('btStatus').innerText = '● Connected to Omega BT-01';
  document.getElementById('btStatus').className = 'status connected';
  alert('Connected to Omega via Bluetooth! You can now control the car.');
}

function toggleSwitch(el) {
  el.classList.toggle('on');
}

function startCharging() {
  charging = true;
  alert('Smart Charging Started. Omega will charge during cheapest 7 hours.');
  let interval = setInterval(() => {
    if(batteryLevel < 100) {
      batteryLevel += 2;
      document.getElementById('batteryFill').style.height = batteryLevel + '%';
      document.getElementById('batteryPercent').innerText = batteryLevel + '%';
    } else {
      clearInterval(interval);
      alert('Charging Complete!');
    }
  }, 800);
}

function navigate() {
  const dest = document.getElementById('destination').value;
  if(!dest) return alert('Enter a destination first');
  
  // Opens Google Maps with destination
  const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
  window.open(url, '_blank');
  alert(`Sending "${dest}" to Omega. Autopilot will navigate you there.`);
}
</script>
</body>
</html>
